name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Ruff lint
        run: |
          ruff check .

      - name: Check Ruff formatting
        run: |
          ruff format --check .

  backend-tests:
    name: Backend Unit and Integration Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          pip install psutil

      - name: Run unit tests
        run: |
          pytest -v backend/tests/unit --junitxml=reports/junit-unit.xml

      - name: Run database migration
        working-directory: ./backend
        env:
          BOOKING_DATABASE_URL: postgresql+asyncpg://booking:booking@127.0.0.1:55432/booking_test
        run: |
          alembic upgrade head

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@127.0.0.1:55432/booking_test
        run: |
          pytest -v backend/tests/integration --junitxml=reports/junit-integration.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: reports/junit-*.xml
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Run component and unit tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  e2e:
    name: E2E (Playwright against Compose)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: deploy/compose.yaml
      COMPOSE_PROJECT_NAME: booking-e2e
      BOOKING_RELEASE: e2e
      BOOKING_COMMIT_SHA: ${{ github.sha }}
      E2E_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build and start the stack
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          docker compose ps -a

      - name: Run Playwright E2E suite
        working-directory: ./frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color

  compose-smoke:
    name: Compose Stack Smoke Test
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: deploy/compose.yaml
      COMPOSE_PROJECT_NAME: booking-ci
      BOOKING_RELEASE: ci
      BOOKING_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start stack and wait for healthy backend
        run: |
          docker compose up -d --build --wait --wait-timeout 180

      - name: Show service status
        run: |
          docker compose ps -a

      - name: Run smoke test against compose stack
        run: |
          python -m scripts.smoke_test \
            --base-url http://localhost:8000 \
            --timeout 60 \
            --expected-release "$BOOKING_RELEASE" \
            --expected-commit-sha "$BOOKING_COMMIT_SHA"

      - name: Verify bookings survive backend recreate (E13)
        run: |
          python -m scripts.persistence_check seed --state-file "$RUNNER_TEMP/e13.json"
          docker compose up -d --force-recreate --no-deps --wait --wait-timeout 120 backend
          python -m scripts.persistence_check verify --state-file "$RUNNER_TEMP/e13.json"

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs --no-color

  observability-config:
    name: Observability Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install "pyyaml>=6,<7"

      - name: Validate Compose overlays
        run: |
          docker compose \
            -f deploy/compose.yaml \
            -f deploy/compose.observability.yaml \
            config --quiet
          docker compose \
            -f deploy/compose.production.yaml \
            -f deploy/compose.observability.yaml \
            config --quiet

      - name: Validate Grafana assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          dashboard = Path("deploy/observability/grafana/dashboards/booking-api-overview.json")
          parsed_dashboard = json.loads(dashboard.read_text(encoding="utf-8"))
          assert parsed_dashboard["uid"] == "booking-api-overview"
          assert parsed_dashboard["panels"]

          provisioning = Path("deploy/observability/grafana/provisioning")
          for path in provisioning.rglob("*.yml"):
              document = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert document["apiVersion"] == 1, path
          PY

      - name: Validate Prometheus config and rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.13.5 \
            check config /etc/prometheus/prometheus.yml

      - name: Test Prometheus alert behavior
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.13.5 \
            test rules /etc/prometheus/tests/booking-alerts.test.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.34.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate OpenTelemetry Collector config
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/otel-collector:/etc/otelcol-contrib:ro" \
            otel/opentelemetry-collector-contrib:0.162.0 \
            validate --config=/etc/otelcol-contrib/config.yaml

      - name: Validate blackbox exporter config
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/blackbox:/etc/blackbox_exporter:ro" \
            prom/blackbox-exporter:v0.27.0 \
            --config.file=/etc/blackbox_exporter/blackbox.yml \
            --config.check

      - name: Validate Tempo and Loki configs
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/tempo:/etc/tempo:ro" \
            grafana/tempo:2.10.8 \
            -config.file=/etc/tempo/tempo.yml \
            -config.verify=true
          docker run --rm \
            -v "$PWD/deploy/observability/loki:/etc/loki:ro" \
            grafana/loki:3.7.8 \
            -config.file=/etc/loki/loki.yml \
            -verify-config=true

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: booking-backend:ci-test

      - name: Scan backend image with Trivy (report only)
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format table \
            --output /reports/trivy-backend.txt \
            booking-backend:ci-test
          cat reports/trivy-backend.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-backend
          path: reports/trivy-backend.txt
