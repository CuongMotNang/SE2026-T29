name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Ruff lint
        run: |
          ruff check .

      - name: Check Ruff formatting
        run: |
          ruff format --check .

  backend-tests:
    name: Backend Unit and Integration Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          pip install psutil

      - name: Run unit tests
        run: |
          pytest -v backend/tests/unit

      - name: Run database migration
        working-directory: ./backend
        env:
          BOOKING_DATABASE_URL: postgresql+asyncpg://booking:booking@127.0.0.1:55432/booking_test
        run: |
          alembic upgrade head

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@127.0.0.1:55432/booking_test
        run: |
          pytest -v backend/tests/integration

  compose-smoke:
    name: Compose Stack Smoke Test
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: deploy/compose.yaml
      COMPOSE_PROJECT_NAME: booking-ci
      BOOKING_RELEASE: ci
      BOOKING_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start stack and wait for healthy backend
        run: |
          docker compose up -d --build --wait --wait-timeout 180

      - name: Show service status
        run: |
          docker compose ps -a

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: booking-backend:ci-test

      - name: Scan backend image with Trivy (report only)
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format table \
            --output /reports/trivy-backend.txt \
            booking-backend:ci-test
          cat reports/trivy-backend.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend
          path: reports/trivy-backend.txt
