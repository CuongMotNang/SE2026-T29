# Production Docker Compose for Booking API on Single Linux VM (ADR-001)
# Note: In production, images MUST be pinned by digest, not by :latest tag.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    volumes:
      # Named volume ensures persistence across container recreate, deploy, and rollback (E13)
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backend:
    # Image must be set via BACKEND_IMAGE_REF from the release manifest (must include @sha256:...)
    image: ${BACKEND_IMAGE_REF:-ghcr.io/cuongmotnang/booking-backend:v0.1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOOKING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@db:5432/${POSTGRES_DB:-booking}
      BOOKING_RELEASE: ${BOOKING_RELEASE:-unknown}
      BOOKING_COMMIT_SHA: ${BOOKING_COMMIT_SHA:-unknown}
      BOOKING_DB_TIMEOUT_SECONDS: ${BOOKING_DB_TIMEOUT_SECONDS:-3.0}
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: booking_postgres_data
