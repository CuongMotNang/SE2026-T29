# Local Development Docker Compose
# Start: docker compose -f deploy/compose.yaml up -d --build --wait
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

  # One-shot job: apply Alembic migrations before the API starts.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: booking-backend:local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOOKING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@db:5432/${POSTGRES_DB:-booking}
    networks:
      - app_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: booking-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BOOKING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@db:5432/${POSTGRES_DB:-booking}
      BOOKING_RELEASE: ${BOOKING_RELEASE:-dev}
      BOOKING_COMMIT_SHA: ${BOOKING_COMMIT_SHA:-local}
      BOOKING_DEPLOYMENT_ENVIRONMENT: ${BOOKING_DEPLOYMENT_ENVIRONMENT:-local}
      BOOKING_TELEMETRY_ENABLED: ${BOOKING_TELEMETRY_ENABLED:-false}
      BOOKING_SERVICE_NAME: ${BOOKING_SERVICE_NAME:-booking-api}
      # This Compose file does not start a Collector. Supply a reachable endpoint when enabled.
      BOOKING_OTLP_ENDPOINT: ${BOOKING_OTLP_ENDPOINT:-http://otel-collector:4317}
      BOOKING_OTLP_INSECURE: ${BOOKING_OTLP_INSECURE:-true}
      BOOKING_TELEMETRY_EXPORTER_TIMEOUT_MILLIS: ${BOOKING_TELEMETRY_EXPORTER_TIMEOUT_MILLIS:-2000}
      BOOKING_TELEMETRY_MAX_QUEUE_SIZE: ${BOOKING_TELEMETRY_MAX_QUEUE_SIZE:-512}
      BOOKING_TELEMETRY_MAX_EXPORT_BATCH_SIZE: ${BOOKING_TELEMETRY_MAX_EXPORT_BATCH_SIZE:-64}
      BOOKING_TELEMETRY_SCHEDULE_DELAY_MILLIS: ${BOOKING_TELEMETRY_SCHEDULE_DELAY_MILLIS:-1000}
      BOOKING_TELEMETRY_METRIC_EXPORT_INTERVAL_MILLIS: ${BOOKING_TELEMETRY_METRIC_EXPORT_INTERVAL_MILLIS:-10000}
      BOOKING_TELEMETRY_EXPORT_LOGS: ${BOOKING_TELEMETRY_EXPORT_LOGS:-true}
      BOOKING_FAULT_MODE: ${BOOKING_FAULT_MODE:-off}
      BOOKING_FAULT_RATE: ${BOOKING_FAULT_RATE:-1.0}
      BOOKING_FAULT_UNTIL: ${BOOKING_FAULT_UNTIL:-}
      BOOKING_FAULT_LATENCY_SECONDS: ${BOOKING_FAULT_LATENCY_SECONDS:-3}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - app_net

networks:
  app_net:
    name: booking_local_net
    driver: bridge

volumes:
  postgres_local_data:
